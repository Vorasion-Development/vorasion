services:
  vorasion_db:
    image: postgres:18
    container_name: vorasion_db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=supersecure
      - POSTGRES_DB=vorasion
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d vorasion']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
  vorasion_redis:
    image: eqalpha/keydb:x86_64_v6.3.4
    container_name: vorasion_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
